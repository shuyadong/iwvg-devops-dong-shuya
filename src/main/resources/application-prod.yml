server:
  port: 8080

springdoc:
  api-docs:
    enabled: false
  swagger:
    enabled: false


app:
  hosting: AWS

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:iwvgdevopsdb}
    username: ${DB_USER:postgresiwvg}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
