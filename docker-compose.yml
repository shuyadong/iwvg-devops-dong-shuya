name: iwvg-devops-dong-shuya

services:
  devops:
    build: .
    image: devops:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iwvgdevopsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    networks:
      - devopsNet

networks:
  devopsNet:
    external: true

# Ambos ficheros (este y docker-compose-db.yml) pertenecen al mismo stack "iwvg-devops-dong-shuya".
# Requiere la red y Postgres activos antes de arrancar la app:
#> docker network create devopsNet
#> docker compose -f docker-compose-db.yml up -d
#> docker compose up --build -d